name: Frontend CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/frontend-ci-cd.yml"

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ktb-community-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ktb-community-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/community-server-key.pem
          chmod 600 ~/.ssh/community-server-key.pem
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and deploy frontend
        run: |
          ssh \
            -i ~/.ssh/community-server-key.pem \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             docker compose -f compose.yml pull frontend && \
             docker compose -f compose.yml up -d frontend && \
             docker compose -f compose.yml ps frontend"

      - name: Check frontend
        run: |
          sleep 5

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            "http://${{ secrets.SERVER_HOST }}/"